# Copy to a private connection file; run dbx secret encrypt and add its password line.
[connection]
# Independent Go driver; add .exe on Windows. For ODBC, see config.odbc.toml.
engine = "sqlserver"
driver_path = "~/.config/dbx/drivers/dbx-driver-sqlserver-0.2.0-driver-process.3"
host = "127.0.0.1"
port = 1433
user = "app"
database = "appdb"
schema = "dbo"
allow_actions = ["query"]
